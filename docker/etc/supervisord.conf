[supervisord]
logfile=/dev/stdout
logfile_maxbytes=0
nodaemon=true
; supervisord and every program below run as the unprivileged `app` user, so
; its pidfile and child logs have to live somewhere writable (/tmp), not
; /var/run.
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
directory=/app

; The bind host is configurable because deployments differ: behind a host-level
; proxy the app is reached over loopback, while under Docker Compose the
; published port is forwarded to the *container IP*, where a loopback bind is
; unreachable (and an in-container loopback healthcheck still passes, so the
; container reports healthy while nothing can talk to it). The entrypoint
; defaults this to 127.0.0.1; compose overrides it to 0.0.0.0.
[program:web]
command=php /app/artisan octane:frankenphp --host=%(ENV_OCTANE_HOST)s --port=8000 --admin-port=2019 --workers=%(ENV_OCTANE_WORKERS)s --log-level=WARN
numprocs=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Horizon owns both queues, including the dedicated `reactive` supervisor that
; keeps recomputes off the default queue. See config/horizon.php.
[program:horizon]
command=php /app/artisan horizon
numprocs=1
autorestart=true
; Horizon needs to finish the job in flight; SIGTERM is its clean shutdown.
stopsignal=TERM
stopwaitsecs=70
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:reverb]
command=php /app/artisan reverb:start --host=0.0.0.0 --port=8001
numprocs=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php /app/artisan schedule:work
numprocs=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
