expose_php=off
display_errors=Off
display_startup_errors=Off
log_errors=On
error_log=/dev/stderr
allow_url_fopen=Off
allow_url_include=Off
enable_dl=Off

; Stack traces must never carry the arguments they were called with; tokens,
; passwords and API keys end up verbatim in the logs otherwise.
zend.exception_ignore_args=On
zend.exception_string_param_max_len=0

session.use_strict_mode=1
session.cookie_httponly=1
session.cookie_samesite=Lax

post_max_size=32M
upload_max_filesize=32M

; With a read-only root filesystem /tmp is a small tmpfs, i.e. RAM. Scratch
; files go to the storage volume instead.
sys_temp_dir=/app/storage/tmp
upload_tmp_dir=/app/storage/tmp

max_execution_time=59
max_input_time=59

realpath_cache_size=4096K
realpath_cache_ttl=600

; Octane keeps the process alive, so the opcache is worth its memory.
opcache.enable=1
opcache.memory_consumption=192
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
